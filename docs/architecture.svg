<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f3640"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7860b"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>

  <rect width="1000" height="650" fill="#ffffff"/>

  <!-- Internet -->
  <rect x="60" y="18" width="300" height="52" rx="26" fill="#eef1f5" stroke="#2f3640" stroke-width="1.5"/>
  <text x="210" y="50" text-anchor="middle" font-size="17" font-weight="600" fill="#2f3640">Internet</text>

  <!-- OPNsense -->
  <rect x="20" y="120" width="960" height="50" rx="6" fill="#2f3640"/>
  <text x="650" y="150" text-anchor="middle" font-size="15" fill="#ffffff"><tspan font-weight="700">OPNsense</tspan> · sole gateway between all networks · default deny</text>

  
  <g font-size="13" fill="#1f2937">
    <!-- DMZ -->
    <rect x="20" y="230" width="180" height="240" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="110" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">DMZ</text>
    <text x="110" y="280" text-anchor="middle" font-weight="700">ctdmz</text>
    <text x="110" y="305" text-anchor="middle">NPMplus</text>
    <text x="110" y="323" text-anchor="middle" fill="#4b5563">reverse proxy</text>
    <text x="110" y="348" text-anchor="middle">CrowdSec agent</text>
    <text x="110" y="366" text-anchor="middle" fill="#4b5563">AppSec as WAF</text>
    <text x="110" y="391" text-anchor="middle">Alloy</text>
    <text x="110" y="409" text-anchor="middle" fill="#4b5563">log shipping</text>

    <!-- PRX -->
    <rect x="215" y="230" width="180" height="240" rx="8" fill="#fff6dc" stroke="#b7860b" stroke-width="1.5"/>
    <text x="305" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#b7860b">Proxy network</text>
    <text x="305" y="280" text-anchor="middle" font-weight="700">Squid</text>
    <text x="305" y="305" text-anchor="middle">egress proxy</text>
    <text x="305" y="330" text-anchor="middle">domain allowlist</text>
    <text x="305" y="365" text-anchor="middle" fill="#4b5563">the servers’ only</text>
    <text x="305" y="383" text-anchor="middle" fill="#4b5563">way to the internet</text>

    <!-- SRV -->
    <rect x="410" y="230" width="180" height="240" rx="8" fill="#e8f1fc" stroke="#2f6fc4" stroke-width="1.5"/>
    <text x="500" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fc4">Server network</text>
    <text x="500" y="280" text-anchor="middle" font-weight="700">ctsrv</text>
    <text x="500" y="305" text-anchor="middle">SearXNG</text>
    <text x="500" y="325" text-anchor="middle">CouchDB</text>
    <text x="500" y="345" text-anchor="middle">Paperless-ngx</text>
    <text x="500" y="365" text-anchor="middle">Gitea</text>
    <text x="500" y="385" text-anchor="middle">Immich</text>

    <!-- ADM -->
    <rect x="605" y="230" width="180" height="240" rx="8" fill="#e7f5ec" stroke="#2e7d4f" stroke-width="1.5"/>
    <text x="695" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d4f">Admin network</text>
    <text x="695" y="280" text-anchor="middle" font-weight="700">ctadm</text>
    <text x="695" y="305" text-anchor="middle">CrowdSec LAPI</text>
    <text x="695" y="325" text-anchor="middle">Loki · Grafana</text>
    <text x="695" y="345" text-anchor="middle">Vaultwarden</text>
    <text x="695" y="365" text-anchor="middle">NetBird</text>
    <line x1="625" y1="385" x2="765" y2="385" stroke="#2e7d4f" stroke-dasharray="3 3"/>
    <text x="695" y="410" text-anchor="middle" font-weight="700">dedicated VMs</text>
    <text x="695" y="430" text-anchor="middle">Wazuh · Checkmk</text>

    <!-- LAN / VPN -->
    <rect x="800" y="230" width="180" height="240" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="890" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#4b5563">LAN · VPN</text>
    <text x="890" y="280" text-anchor="middle" font-weight="700">Clients</text>
    <text x="890" y="305" text-anchor="middle">NAS · PBS</text>
    <text x="890" y="330" text-anchor="middle">WireGuard</text>
    <text x="890" y="350" text-anchor="middle">NetBird peers</text>
  </g>

  
  <line x1="110" y1="70" x2="110" y2="227" stroke="#2f3640" stroke-width="2.5" marker-end="url(#aDark)"/>
  <text x="120" y="100" font-size="12.5" font-weight="600" fill="#2f3640">inbound: 443 only</text>

  
  <line x1="305" y1="230" x2="305" y2="74" stroke="#b7860b" stroke-width="3" marker-end="url(#aAmber)"/>
  <text x="315" y="100" font-size="12.5" font-weight="600" fill="#b7860b">outbound: allowlist only</text>

  <!-- Firewall-Bouncer <-> LAPI -->
  <line x1="695" y1="173" x2="695" y2="227" stroke="#2e7d4f" stroke-width="2" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
  <text x="705" y="205" font-size="12.5" fill="#2e7d4f">firewall bouncer ⇄ LAPI</text>

  
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <path d="M100,470 V505 H695"/>
    <path d="M500,505 V475" marker-end="url(#aRed)"/>
    <path d="M695,505 V475" marker-end="url(#aRed)"/>
  </g>
  <text x="752" y="509" font-size="12.5" fill="#c0392b">reverse proxy · logs · LAPI</text>

  
  <g stroke="#b7860b" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M60,540 H735"/>
    <path d="M60,540 V475" marker-end="url(#aAmber)"/>
    <path d="M305,540 V475" marker-end="url(#aAmber)"/>
    <path d="M540,540 V475" marker-end="url(#aAmber)"/>
    <path d="M735,540 V475" marker-end="url(#aAmber)"/>
  </g>
  <text x="752" y="544" font-size="12.5" fill="#b7860b">updates ⇄ egress proxy</text>

  
  <g stroke="#6b7280" stroke-width="2" stroke-dasharray="2 4" fill="none">
    <path d="M960,470 V575 H150"/>
    <path d="M150,575 V475" marker-end="url(#aGrey)"/>
  </g>
  <text x="752" y="594" font-size="12.5" fill="#4b5563">internal access via proxy</text>

  
  <text x="500" y="632" text-anchor="middle" font-size="12.5" fill="#4b5563">ctdmz · ctsrv · ctadm: AlmaLinux 10 · rootless Podman · SELinux · one Linux user per service · firewalld open to the reverse proxy only</text>
</svg>
